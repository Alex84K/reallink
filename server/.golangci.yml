version: "2"

# Границы между срезами, которые не проверяет компилятор (CONVENTIONS §3).
linters:
  default: standard
  enable:
    - depguard
    - errorlint
    - bodyclose
    - noctx
    - sqlclosecheck
    - rowserrcheck
    - forbidigo
  settings:
    forbidigo:
      forbid:
        - pattern: ^time\.Now$
          msg: "используйте порт Clock (CONVENTIONS §6)"
    depguard:
      rules:
        participant-isolation:
          files:
            - "**/internal/participant/**"
            - "!**/*_test.go"
          deny:
            - pkg: reallink/server/internal/admin$
              desc: "срез не импортирует срез — порт в ports.go, сборка в internal/app"
            - pkg: reallink/server/internal/admin/internal
              desc: "внутренности чужого среза недоступны"
            - pkg: reallink/server/internal/matching$
              desc: "срез не импортирует срез — порт в ports.go, сборка в internal/app"
            - pkg: reallink/server/internal/matching/internal
              desc: "внутренности чужого среза недоступны"
            - pkg: reallink/server/internal/meeting$
              desc: "срез не импортирует срез — порт в ports.go, сборка в internal/app"
            - pkg: reallink/server/internal/meeting/internal
              desc: "внутренности чужого среза недоступны"
            - pkg: reallink/server/internal/safety$
